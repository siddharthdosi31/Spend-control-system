<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Northstar Spend Control Room</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#101C26;--mute:#5B6B78;--line:#DCE2E8;--acc:#0E6E78;--bad:#B83A1B;--warn:#B7791F;--ok:#2F7D4F;--soft:#F5F7F9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0D161D;--card:#15212B;--ink:#E6EDF2;--mute:#93A4B1;--line:#25343F;--acc:#4FB6C0;--bad:#F0805F;--warn:#E3B04B;--ok:#6CC38D;--soft:#101B24;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0D161D;--card:#15212B;--ink:#E6EDF2;--mute:#93A4B1;--line:#25343F;--acc:#4FB6C0;--bad:#F0805F;--warn:#E3B04B;--ok:#6CC38D;--soft:#101B24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header{padding:18px 20px 6px;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:600;letter-spacing:-.01em}.sub{color:var(--mute);font-size:12.5px;max-width:760px}
#fb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:end;border-bottom:1px solid var(--line)}
#fb label{display:flex;flex-direction:column;font-size:11px;color:var(--mute);gap:2px}
select,input,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:150px}
select.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}button{cursor:pointer}button:hover{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
nav{display:flex;gap:2px;padding:10px 20px 0;overflow-x:auto}nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--mute);font-weight:500;white-space:nowrap;max-width:none}
nav button.on{color:var(--ink);border-color:var(--acc)}
main{padding:14px 20px 40px;display:grid;gap:14px;max-width:1400px}
.g{display:grid;gap:14px}.k6{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.c3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 2px;font-size:14px;font-weight:600}.card .s{color:var(--mute);font-size:12px;margin-bottom:10px}
.kpi b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;margin:2px 0}.kpi span{color:var(--mute);font-size:12px}.kpi small{font-size:12px}
.up{color:var(--bad)}.dn{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.bars{display:grid;gap:5px}.br{display:grid;grid-template-columns:minmax(80px,150px) 1fr auto auto;gap:8px;align-items:center;font-size:12.5px;cursor:pointer;border-radius:5px;padding:1px 3px}
.br:hover,.br.on{background:var(--soft)}.br.on .bl{font-weight:600}.br.nf{cursor:default}.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:9px;background:var(--soft);border-radius:5px;position:relative;overflow:hidden;display:block}.bt i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bt i.bad{background:var(--bad)}.bt i.warn{background:var(--warn)}.bt u{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.5}
.br em{color:var(--mute);font-style:normal;font-size:11.5px;min-width:34px;text-align:right}.br b{font-weight:500;text-align:right;min-width:48px}
.al{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.a{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--card);text-align:left;max-width:none;width:100%}
.a.h{border-left-color:var(--bad)}.a:hover{background:var(--soft)}.a b{display:block;font-size:13.5px}.a span{color:var(--mute);font-size:12px;display:block}.a strong{font-size:18px;font-weight:600}
svg.chart{width:100%;height:auto}.chart text{fill:var(--mute);font-size:11px;text-anchor:middle;font-family:inherit}.chart .v{fill:var(--ink);font-weight:500}.chart .up{fill:var(--bad)}.chart .dn{fill:var(--ok)}
.chart rect{fill:var(--acc);opacity:.75}.chart .col{cursor:pointer}.chart .col:hover rect,.chart .col.on rect{opacity:1}.chart line{stroke:var(--mute);stroke-dasharray:4 4}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mute);font-weight:500;position:sticky;top:0;background:var(--card)}td.n,th.n{text-align:right}td:last-child{white-space:normal;min-width:260px}
.sc{overflow:auto;max-height:560px}.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;margin:0 3px 0 0;background:var(--soft);border:1px solid var(--line);color:var(--ink);cursor:pointer;max-width:none}
.chip.h{border-color:var(--bad);color:var(--bad)}.chip.m{border-color:var(--warn);color:var(--warn)}.chip.on{background:var(--ink);color:var(--card)}
.heat td{text-align:center;padding:4px 6px;font-size:11.5px;border:1px solid var(--card)}.heat td:first-child{text-align:left;border:0;border-bottom:1px solid var(--line)}
.note{font-size:12px;color:var(--mute);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px}.empty{padding:30px;text-align:center;color:var(--mute)}
@media(max-width:600px){#fb select{max-width:46vw}header,main,#fb,nav{padding-left:12px;padding-right:12px}}
</style></head><body>

const F={m:'',dp:'',s:'',pj:'',e:'',v:'',c:'',pm:'',st:'live',fl:''};let TAB='ov',Q='',HI=true,SORT='sc';
const FK=[['m','Month'],['dp','Department'],['s','Site'],['pj','Project'],['e','Employee'],['v','Vendor'],['c','Category'],['pm','Payment method']];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const inr=n=>{const a=Math.abs(n),s=n<0?'-':'';return s+'₹'+(a>=1e7?(a/1e7).toFixed(2)+' Cr':a>=1e5?(a/1e5).toFixed(1)+' L':a>=1e3?(a/1e3).toFixed(1)+'K':a.toFixed(0))};
const pc=(x,d=0)=>(x*100).toFixed(d)+'%',MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],fm=m=>MN[+m.slice(5)-1]+' '+m.slice(2,4);
const sum=(rs,f=r=>r.a)=>rs.reduce((a,r)=>a+f(r),0);
const grp=(rs,k,f=r=>r.a)=>{const m=new Map();rs.forEach(r=>{const x=typeof k=='function'?k(r):r[k];m.set(x,(m.get(x)||0)+f(r))});return[...m].sort((a,b)=>b[1]-a[1])};
const stOK=r=>F.st=='all'||(F.st=='live'?r.st=='Completed'||r.st=='Pending':r.st==F.st);
const pass=(r,skip=[])=>stOK(r)&&FK.every(([k])=>skip.includes(k)||!F[k]||r[k]===F[k])&&(!F.fl||r.f.includes(F.fl));
const MS=[...new Set(D.tx.map(r=>r.m))].sort(),opts=k=>[...new Set(D.tx.map(r=>r[k]))].sort();
const pctl=(a,p)=>{a=a.filter(x=>x!=null).sort((x,y)=>x-y);return a.length?a[Math.min(a.length-1,Math.floor(p*a.length))]:0};
const card=(t,s,b,cls='')=>`<div class="card ${cls}"><h3>${t}</h3><div class="s">${s||''}</div>${b}</div>`;
const bars=(es,{fk='',f=inr,max=10,tot=0}={})=>es.length?'<div class="bars">'+es.slice(0,max).map(([k,v])=>{const mx=Math.max(...es.slice(0,max).map(e=>e[1]),1e-9);return `<div class="br${fk&&F[fk]===k?' on':''}${fk?'':' nf'}" ${fk?`data-fk="${fk}" data-v="${esc(k)}"`:''}><span class="bl" title="${esc(k)}">${esc(k)}</span><span class="bt"><i style="width:${Math.max(v,0)/mx*100}%"></i></span><b>${f(v)}</b><em>${tot?pc(v/tot):''}</em></div>`}).join('')+'</div>':'<div class="empty">No data for this selection</div>';
function kpi(l,v,sub){return `<div class="card kpi"><span>${l}</span><b>${v}</b><small>${sub||''}</small></div>`}
function badge(c){const w=FL[c][2];return `<span class="chip ${w>=4?'h':w==3?'m':''}" title="${esc(FL[c][1])}">${FL[c][0]}</span>`}
function budgetRows(skipM){return D.bud.filter(b=>(skipM||!F.m||b[0]==F.m)&&(!F.dp||b[1]==F.dp)&&(!F.s||b[2]==F.s))}
function actualBy(rs){const m=new Map();rs.forEach(r=>{const k=r.m+'|'+r.dp+'|'+r.s;m.set(k,(m.get(k)||0)+r.a)});return m}
const budOK=()=>!(F.pj||F.e||F.v||F.c||F.pm||F.fl);
function budSplit(key){const bs=budgetRows(),ax=actualBy(D.tx.filter(r=>stOK(r))),acc=new Map();bs.forEach(b=>{const a=acc.get(b[key])||[0,0];a[0]+=ax.get(b[0]+'|'+b[1]+'|'+b[2])||0;a[1]+=b[3];acc.set(b[key],a)});return[...acc].map(([k,[a,b]])=>[k,a,b]).sort((x,y)=>y[1]/y[2]-x[1]/x[2])}
const ubars=(es,fk)=>'<div class="bars">'+es.map(([k,a,b])=>{const u=a/b;return `<div class="br${F[fk]===k?' on':''}" data-fk="${fk}" data-v="${esc(k)}"><span class="bl">${esc(k)}</span><span class="bt"><i class="${u>1?'bad':u>.8?'warn':''}" style="width:${Math.min(u,1.6)/1.6*100}%"></i><u style="left:${100/1.6}%"></u></span><b class="${u>1?'bad':''}">${pc(u)}</b><em style="min-width:110px">${inr(a)} / ${inr(b)}</em></div>`}).join('')+'</div>';
function trend(){const rs=D.tx.filter(r=>pass(r,['m'])),v=MS.map(m=>sum(rs.filter(r=>r.m==m))),mx=Math.max(...v,1),W=720,bw=W/MS.length,av=sum(v,x=>x)/MS.length;
let s=`<svg class="chart" viewBox="0 0 ${W} 215" role="img" aria-label="Monthly spend">`+`<line x1="0" x2="${W}" y1="${165-av/mx*125}" y2="${165-av/mx*125}"/><text x="2" y="${158-av/mx*125}" style="text-anchor:start">avg ${inr(av)}</text>`;
MS.forEach((m,i)=>{const h=v[i]/mx*125,x=i*bw+bw*.17,ch=i&&v[i-1]?v[i]/v[i-1]-1:null,cx=i*bw+bw/2;s+=`<g class="col${F.m==m?' on':''}" data-fk="m" data-v="${m}"><rect x="${x}" y="${165-h}" width="${bw*.66}" height="${h}" rx="3"/><text x="${cx}" y="${158-h}" class="v">${inr(v[i])}</text><text x="${cx}" y="184">${fm(m)}</text>${ch!=null?`<text x="${cx}" y="202" class="${ch>.15?'up':ch<-.15?'dn':''}">${ch>=0?'▲':'▼'} ${Math.abs(ch*100).toFixed(0)}%</text>`:''}</g>`});return s+'</svg>'}
function render(){const rs=D.tx.filter(r=>pass(r));window.RS=rs;
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==TAB));
document.querySelectorAll('#fb select').forEach(s=>s.classList.toggle('on',s.dataset.k&&F[s.dataset.k]!=''&&s.dataset.k!='st'));
$('#main').innerHTML=!rs.length&&TAB!='tx'?'<div class="card empty">No transactions match these filters. Reset or widen them.</div>':({ov,bu,mx,ct,tx})[TAB](rs);if(TAB=='tx')txBody()}
function ov(rs){const tot=sum(rs),tm=F.m||MS[MS.length-1],pm=MS[MS.indexOf(tm)-1],nm=D.tx.filter(r=>pass(r,['m'])),cur=sum(nm.filter(r=>r.m==tm)),prv=pm?sum(nm.filter(r=>r.m==pm)):0,mom=prv?cur/prv-1:0;
const bs=budgetRows(),ax=actualBy(D.tx.filter(r=>stOK(r))),ba=budOK()?bs.reduce((x,b)=>x+(ax.get(b[0]+'|'+b[1]+'|'+b[2])||0),0):0,bt=sum(bs,b=>b[3]);
const pend=rs.filter(r=>r.as_=='Pending'),pol=rs.filter(r=>!r.pc),nr=rs.filter(r=>!r.r),hrs=rs.map(r=>r.h).filter(x=>x!=null),fx=rs.filter(r=>r.sc>=3);
const al=Object.keys(FL).map(c=>[c,rs.filter(r=>r.f.includes(c))]).filter(([c,a])=>a.length&&FL[c][2]>=2&&c!='NORC').sort((a,b)=>FL[b[0]][2]-FL[a[0]][2]||sum(b[1])-sum(a[1])).slice(0,8);
return `<div class="g k6">${kpi('Total spend',inr(tot),`${rs.length} transactions`)}${kpi(F.m?fm(F.m)+' vs prior month':fm(tm)+' vs '+(pm?fm(pm):'–'),`<span class="${mom>0?'up':'dn'}" style="color:inherit">${mom>=0?'▲':'▼'} ${pc(Math.abs(mom))}</span>`,`${inr(cur)} vs ${inr(prv)}`)}${kpi('Budget used',budOK()&&bt?pc(ba/bt):'n/a',budOK()?`${inr(ba)} of ${inr(bt)}`:'Budgets exist by month, department and site only')}${kpi('Awaiting approval',inr(sum(pend)),`${pend.length} items`)}${kpi('Policy breaches',pc(pol.length/rs.length),`${pol.length} items, ${inr(sum(pol))}`)}${kpi('Missing receipts',pc(nr.length/rs.length),`${nr.length} items, ${inr(sum(nr))}`)}${kpi('Approval time (median / P90)',pctl(hrs,.5).toFixed(0)+'h / '+pctl(hrs,.9).toFixed(0)+'h',`${hrs.filter(h=>h>48).length} took over 48h`)}${kpi('High-risk items',inr(sum(fx)),`${fx.length} items with risk score 3+`)}</div>
${card('Needs attention','Largest control failures in the current selection. Click one to see the transactions.',`<div class="al">${al.map(([c,a])=>`<button class="a ${FL[c][2]>=4?'h':''}" data-fl="${c}"><b>${FL[c][0]}</b><strong>${inr(sum(a))}</strong> <span style="display:inline">${a.length} items</span><span>${FL[c][1]}</span></button>`).join('')||'<div class="empty">No major exceptions in this selection</div>'}</div>`)}
${card('Monthly spend','Click a month to filter. Percentages are month-on-month change. Dashed line is the average.',trend())}
<div class="g c3">${card('Department','',bars(grp(rs,'dp'),{fk:'dp',tot})) }${card('Site','',bars(grp(rs,'s'),{fk:'s',tot}))}${card('Payment method','Card, UPI, reimbursement or vendor payment',bars(grp(rs,'pm'),{fk:'pm',tot}))}</div>`}
function bu(rs){if(!budOK())return '<div class="card note">Budgets are set by month, department and site only. Clear the project, employee, vendor, category, payment-method and risk filters to compare against budget.</div>';
const bs=budgetRows(),ax=actualBy(D.tx.filter(r=>stOK(r))),T=sum(bs,b=>b[3]),A=bs.reduce((a,b)=>a+(ax.get(b[0]+'|'+b[1]+'|'+b[2])||0),0),over=bs.filter(b=>(ax.get(b[0]+'|'+b[1]+'|'+b[2])||0)>b[3]);
const ds=[...new Set(D.bud.filter(b=>(!F.dp||b[1]==F.dp)&&(!F.s||b[2]==F.s)).map(b=>b[1]+'|'+b[2]))].sort();
const hm=`<div class="sc"><table class="heat"><tr><th>Department · site</th>${MS.map(m=>`<th style="text-align:center">${fm(m)}</th>`).join('')}</tr>${ds.map(d=>{const[dp,s]=d.split('|');return `<tr><td>${dp} · ${s}</td>${MS.map(m=>{const b=D.bud.find(x=>x[0]==m&&x[1]==dp&&x[2]==s),a=ax.get(m+'|'+dp+'|'+s)||0,u=b?a/b[3]:0;return `<td title="${inr(a)} of ${inr(b?b[3]:0)}" style="background:${u>=1?`rgba(194,65,12,${Math.min(.3+(u-1)*.25,.95)})`:`rgba(14,110,120,${.05+Math.min(u,1)*.55})`}">${pc(u)}</td>`}).join('')}</tr>`}).join('')}</table></div>`;
return `<div class="g k6">${kpi('Budget',inr(T),`${bs.length} budget lines`)}${kpi('Actual',inr(A),'completed + pending')}${kpi('Utilisation',pc(A/T,1),'of budget used')}${kpi('Lines over budget',over.length,`${inr(sum(over,b=>(ax.get(b[0]+'|'+b[1]+'|'+b[2])||0)-b[3]))} overspend`)}</div>
<div class="note">Across the full period, Operations, Procurement and Projects use under 15% of their budgets while Finance runs at about 2.4× its budget. Either the site budgets are far too generous or spend is being booked to the wrong department. The 100% mark is the thin vertical line.</div>
<div class="g c2">${card('By department','Click to filter',ubars(budSplit(1),'dp'))}${card('By site','Click to filter',ubars(budSplit(2),'s'))}</div>${card('Utilisation by department, site and month','Hover for amounts. Orange cells are over budget; teal depth shows how much is used.',hm)}`}
function mx(rs){const tot=sum(rs),v=grp(rs,'v'),t3=sum(v.slice(0,3),x=>x[1])/tot,nv=sum(rs.filter(r=>['Employee Claim','Independent Vendor','Local Merchant','Client Venue'].includes(r.v)));
return `<div class="g c2">${card('Spend by category','Click to filter',bars(grp(rs,'c'),{fk:'c',max:14,tot}))}${card('Top vendors',`Top 3 vendors = ${pc(t3)} of spend. Unlisted payees (no vendor ID) = ${inr(nv)}.`,bars(v,{fk:'v',max:12,tot}))}</div>
<div class="g c3">${card('Top employees','By spend',bars(grp(rs,'e'),{fk:'e',tot}))}${card('Project / cost centre','',bars(grp(rs,'pj'),{fk:'pj',tot}))}${card('Recurring vs one-time','',bars(grp(rs,r=>r.rc?'Recurring':'One-time'),{tot}))}
${card('Transaction type','',bars(grp(rs,'tt'),{tot}))}${card('Currency','Converted at fixed rates: USD 83.2, SGD 62',bars(grp(rs,'cur'),{tot}))}</div>`}
function rate(rs,k,p,min=6){const m=new Map();rs.forEach(r=>{const x=r[k],a=m.get(x)||[0,0];a[1]++;if(p(r))a[0]++;m.set(x,a)});return[...m].filter(([,a])=>a[1]>=min).map(([k,a])=>[k,a[0]/a[1]]).sort((a,b)=>b[1]-a[1])}
function ct(rs){const hs=rs.filter(r=>r.h!=null),bk=[['Under 4h',0,4],['4–12h',4,12],['12–24h',12,24],['24–48h',24,48],['Over 48h',48,1e9]].map(([l,a,b])=>[l,hs.filter(r=>r.h>=a&&r.h<b).length]),
ap=new Map();hs.forEach(r=>{const a=ap.get(r.ap)||[0,0];a[0]+=r.h;a[1]++;ap.set(r.ap,a)});

${card('Approval status','Value by approval state',bars(grp(rs,'as_'),{tot:sum(rs)}))}</div>
<div class="g c3">${card('Approval turnaround','Number of approvals by time taken',bars(bk,{f:x=>x,max:6}))}${card('Slowest approvers','Average hours, at least 5 decisions',bars([...ap].filter(([,a])=>a[1]>=5).map(([k,a])=>[k,a[0]/a[1]]).sort((a,b)=>b[1]-a[1]),{f:x=>x.toFixed(0)+'h',max:8}))}${card('Slowest sites','Average approval hours',bars(grp(hs,'s',r=>r.h).map(([k,v])=>[k,v/hs.filter(r=>r.s==k).length]).sort((a,b)=>b[1]-a[1]),{fk:'s',f:x=>x.toFixed(0)+'h'}))}</div>
<div class="g c3">${card('Policy breaches by reason','Value of non-compliant spend',bars(grp(rs.filter(r=>!r.pc),'px'),{tot:sum(rs.filter(r=>!r.pc))}))}${card('Breach rate by site','Share of transactions that fail policy',bars(rate(rs,'s',r=>!r.pc),{fk:'s',f:x=>pc(x)}))}${card('Missing receipts by method','Share with no receipt',bars(rate(rs,'pm',r=>!r.r),{fk:'pm',f:x=>pc(x)}))}</div>
<div class="note">The automated policy check flags only ${rs.filter(r=>!r.r&&r.px=='Missing receipt').length} of the ${rs.filter(r=>!r.r).length} transactions that have no receipt. The rest pass as compliant.</div>`}
function txBody(){let rs=window.RS.filter(r=>(!HI||r.sc>=3||F.fl)&&(!Q||(r.id+r.e+r.v+r.c+r.s).toLowerCase().includes(Q)));rs=[...rs].sort(SORT=='sc'?(a,b)=>b.sc-a.sc||b.a-a.a:SORT=='a'?(a,b)=>b.a-a.a:(a,b)=>b.d.localeCompare(a.d));window.TR=rs;

function tx(rs){return card('Transactions',`Ranked by risk score. Chips filter by check.`,`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center"><input id="q" placeholder="Search ID, person, vendor…" value="${esc(Q)}"><label><input type="checkbox" id="hi" ${HI?'checked':''}> Risk score 3+ only</label><select id="so"><option value="sc">Sort: risk</option><option value="a" ${SORT=='a'?'selected':''}>Sort: amount</option><option value="d" ${SORT=='d'?'selected':''}>Sort: newest</option></select><button id="csv">Export CSV</button></div><div style="margin-bottom:10px"><span class="chip ${F.fl?'':'on'}" data-fl="">All checks</span> ${Object.keys(FL).map(c=>`<span class="chip ${F.fl==c?'on':''}" data-fl="${c}" title="${esc(FL[c][1])}">${FL[c][0]} (${window.RS.filter(r=>r.f.includes(c)).length})</span>`).join('')}</div><div id="tb"></div>`)}
function build(){$('#fb').innerHTML=FK.map(([k,l])=>`<label>${l}<select data-k="${k}"><option value="">All</option>${opts(k).map(o=>`<option value="${esc(o)}">${k=='m'?fm(o):esc(o)}</option>`).join('')}</select></label>`).join('')+`<label>Status scope<select data-k="st"><option value="live">Completed + pending</option><option value="all">All statuses</option><option>Completed</option><option>Pending</option><option>Declined</option><option>Reversed</option></select></label>`;
$('#tabs').innerHTML=[['ov','Overview'],['bu','Budget vs actual'],['mx','Spend mix'],['ct','Controls & approvals'],['tx','Exceptions & ledger']].map(([t,l])=>`<button data-t="${t}">${l}</button>`).join('')}
function sync(){document.querySelectorAll('#fb select').forEach(s=>s.value=F[s.dataset.k])}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.k){F[t.dataset.k]=t.value;render()}else if(t.id=='hi'){HI=t.checked;txBody()}else if(t.id=='so'){SORT=t.value;txBody()}});

else if(f){F.fl=F.fl===f.dataset.fl?'':f.dataset.fl;if(TAB!='tx'){TAB='tx';HI=false}render()}

else if(t.id=='rs'){Object.assign(F,{m:'',dp:'',s:'',pj:'',e:'',v:'',c:'',pm:'',st:'live',fl:''});Q='';sync();render()}
else if(t.id=='csv'){const h=['id','d','e','dp','s','v','c','pm','a','as_','st','px'],c=[h.join(',')].concat(window.TR.map(r=>h.map(k=>'"'+String(r[k]).replace(/"/g,'""')+'"').join(',')+',"'+r.f.join(' ')+'"')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='northstar_exceptions.csv';a.click()}});
build();sync();render();
</script></body></html>
